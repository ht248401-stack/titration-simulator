<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>中和滴定</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:sans-serif;padding:10px;background:#f5f5f5;}
.box{max-width:340px;margin:0 auto;background:#fff;padding:12px;border-radius:8px;}
h1{text-align:center;font-size:16px;margin-bottom:10px;}
.group{border:1px solid #ddd;padding:8px;border-radius:6px;background:#fafafa;margin-bottom:8px;}
label{display:block;margin-top:6px;font-weight:bold;font-size:12px;}
select,input{width:100%;padding:5px;margin-top:3px;border:1px solid #ccc;border-radius:4px;font-size:12px;}
.view{display:flex;justify-content:center;align-items:center;gap:10px;margin:10px 0;font-size:12px;}
.beaker{width:50px;height:50px;border:2px solid #7f8c8d;border-top:none;border-radius:0 0 6px 6px;position:relative;background:#fff;}
.water{position:absolute;bottom:0;left:0;right:0;height:30px;background:#e0e0e0;border-radius:0 0 4px 4px;opacity:0.7;}
.area{text-align:center;margin:8px 0;padding:8px;background:#eef2f3;border-radius:6px;}
.btn{background:#3498db;color:#fff;border:none;padding:6px 12px;font-size:12px;font-weight:bold;border-radius:4px;cursor:pointer;}
.btn-r{background:#e74c3c;}
.txt{font-size:12px;font-weight:bold;margin-top:6px;}
canvas{background:#fff;border:1px solid #ccc;width:100%!important;height:auto!important;aspect-ratio:1.2/1;display:block;}
</style>
</head>
<body>
<div class="box">
<h1>中和滴定シミュレータ</h1>
<div class="group">
<label style="color:#2980b9;">🧪 実験パターン</label>
<select id="mode">
<option value="a_b">酸を塩基で滴定</option>
<option value="b_a">塩基を酸で滴定</option>
</select>
<label style="color:#e67e22;">🎨 指示薬</label>
<select id="ind">
<option value="none">なし</option>
<option value="pp">フェノールフタレイン</option>
<option value="mo">メチルオレンジ</option>
</select>
</div>
<div class="group">
<h3 style="font-size:12px;">ビーカーの中身</h3>
<label>強さ</label><select id="bkT"><option value="s">強</option><option value="w">弱</option></select>
<label>濃度(mol/L)</label><input type="number" id="bkC" value="0.1" step="0.01">
<label>体積(mL)</label><input type="number" id="bkV" value="10" step="1">
</div>
<div class="group">
<h3 style="font-size:12px;">ビュレットの中身</h3>
<label>強さ</label><select id="brT"><option value="s">強</option><option value="w">弱</option></select>
<label>濃度(mol/L)</label><input type="number" id="brC" value="0.1" step="0.01">
</div>
<div class="view">
<div>液の色：</div>
<div class="beaker"><div id="liquid" class="water"></div></div>
</div>
<div class="area">
<button id="go" class="btn">▶ スタート</button>
<button id="reset" class="btn btn-r">🔄 リセット</button>
<div id="status" class="txt">滴下: 0.0mL | pH: --</div>
</div>
<canvas id="cv" width="400" height="340"></canvas>
</div>
<script>
let timer=null,drip=0,max=25,step=0.2,pts=[];
document.getElementById('mode').addEventListener('change',function(){
resetSim();
});
function getColor(type,pH){
if(type==='pp'){
if(pH<8.3)return 'rgba(255,255,255,0.7)';
if(pH>10.0)return 'rgba(255,20,147,0.8)';
return `rgba(255,20,147,${0.1+((pH-8.3)/1.7)*0.7})`;
}else if(type==='mo'){
if(pH<3.1)return 'rgba(255,69,0,0.8)';
if(pH>4.4)return 'rgba(255,215,0,0.8)';
return 'rgba(255,140,0,0.8)';
}
return 'rgba(224,224,224,0.5)';
}
function getpH(mode,bkT,bkC,bkV,brT,brC,addV){
let mBk=bkC*(bkV/1000),mBr=brC*(addV/1000);
let tot=(parseFloat(bkV)+parseFloat(addV))/1000,pH=7;
if(mode==='a_b'){
if(bkT==='s'&&brT==='s'){
if(mBk>mBr)pH=-Math.log10((mBk-mBr)/tot);
else if(mBr>mBk)pH=14+Math.log10((mBr-mBk)/tot);
}else{
if(addV===0)pH=0.5*(3.0-Math.log10(bkC));
else if(mBk>mBr)pH=3.0+Math.log10(mBr/(mBk-mBr));
else if(mBk===mBr)pH=8.5;
else pH=14+Math.log10((mBr-mBk)/tot);
}
}else{
if(bkT==='s'&&brT==='s'){
if(mBk>mBr)pH=14+Math.log10((mBk-mBr)/tot);
else if(mBr>mBk)pH=-Math.log10((mBr-mBk)/tot);
}else{
if(addV===0)pH=14-(0.5*(3.0-Math.log10(bkC)));
else if(mBk>mBr)pH=11.0-Math.log10(mBr/(mBk-mBr));
else if(mBk===mBr)pH=5.5;
else pH=-Math.log10((mBr-mBk)/tot);
}
}
return Math.max(0,Math.min(14,pH));
}
function draw(){
const c=document.getElementById('cv');if(!c)return;
const ctx=c.getContext('2d'),w=c.width,h=c.height;
const pL=40,pR=15,pT=15,pB=30,gW=w-pL-pR,gH=h-pT-pB;
ctx.clearRect(0,0,w,h);
ctx.strokeStyle='#e0e0e0';ctx.lineWidth=1;ctx.font='12px sans-serif';
for(let i=0;i<=14;i+=2){
let y=pT+gH-(i/14)*gH;
ctx.beginPath();ctx.moveTo(pL,y);ctx.lineTo(w-pR,y);ctx.stroke();
ctx.fillStyle='#333';ctx.textAlign='right';ctx.fillText(i,pL-8,y+4);
}
for(let i=0;i<=max;i+=5){
let x=pL+(i/max)*gW;
ctx.beginPath();ctx.moveTo(x,pT);ctx.lineTo(x,h-pB);ctx.stroke();
ctx.fillStyle='#333';ctx.textAlign='center';ctx.fillText(i+'m',x,h-pB+14);
}
if(pts.length>0){
ctx.strokeStyle='#2ecc71';ctx.lineWidth=3;ctx.beginPath();
for(let i=0;i<pts.length;i++){
let x=pL+(pts[i].x/max)*gW,y=pT+gH-(pts[i].y/14)*gH;
if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
}
ctx.stroke();
let last=pts[pts.length-1];
let lx=pL+(last.x/max)*gW,ly=pT+gH-(last.y/14)*gH;
ctx.fillStyle='#e74c3c';ctx.beginPath();ctx.arc(lx,ly,5,0,2*Math.PI);ctx.fill();
}
}
function sim(){
document.getElementById('go').disabled=true;
document.querySelectorAll('input,select').forEach(el=>el.disabled=true);
const md=document.getElementById('mode').value;
const ind=document.getElementById('ind').value;
const bkT=document.getElementById('bkT').value;
const bkC=parseFloat(document.getElementById('bkC').value)||0.1;
const bkV=parseFloat(document.getElementById('bkV').value)||10;
const brT=document.getElementById('brT').value;
const brC=parseFloat(document.getElementById('brC').value)||0.1;
if(timer)clearInterval(timer);
timer=setInterval(()=>{
if(drip>max){clearInterval(timer);return;}
const pH=getpH(md,bkT,bkC,bkV,brT,brC,drip);
pts.push({x:drip,y:pH});draw();
document.getElementById('liquid').style.backgroundColor=getColor(ind,pH);
document.getElementById('status').innerText=`滴下:${drip.toFixed(1)}mL|pH:${pH.toFixed(2)}`;
drip+=step;
},40);
}
function resetSim(){
if(timer)clearInterval(timer);
drip=0;pts=[];
document.getElementById('go').disabled=false;
document.querySelectorAll('input,select').forEach(el=>el.disabled=false);
document.getElementById('status').innerText=`滴下: 0.0mL | pH: --`;
document.getElementById('liquid').style.backgroundColor='rgba(224,224,224,0.5)';
draw();
}
document.getElementById('go').addEventListener('click',sim);
document.getElementById('reset').addEventListener('click',resetSim);
document.querySelectorAll('input,select').forEach(el=>{
if(el.id!=='mode')el.addEventListener('input',resetSim);
});
window.onload=function(){resetSim();};
</script>
</body>
</html>
